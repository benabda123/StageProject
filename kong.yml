            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - Authorization
          max_age: 3600
          credentials: true
      - name: jwt

  - name: auth-service
    url: http://auth-service:8084
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Accept-Version
                - Content-Length
                - Content-MD5
                - Content-Type
                - Date
                - Authorization
              exposed_headers:
                - Authorization
              max_age: 3600
              credentials: true
          - name: jwt
      # Route publique (SANS plugin jwt) pour les images d'avatar :
      # Kong fait correspondre le chemin le plus long, donc /auth/profile/uploads/*
      # passe par cette route et contourne la vérification JWT, tandis que tout
      # le reste de /auth/* reste protégé. strip_path:false conserve le préfixe
      # complet (le service sert les fichiers sur /auth/profile/uploads).
      - name: auth-route-uploads
        paths:
          - /auth/profile/uploads
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Accept-Version
                - Content-Length
                - Content-MD5
                - Content-Type
                - Date
                - Authorization
              exposed_headers:
                - Authorization
              max_age: 3600
              credentials: true
      # Routes PUBLIQUES (SANS plugin jwt) pour la réinitialisation de mot de passe :
      # l'utilisateur n'est pas connecté à ce stade. Kong fait correspondre le chemin
      # le plus long, donc /auth/forgot-password et /auth/reset-password passent par
      # cette route et contournent la vérification JWT, tandis que tout le reste de
      # /auth/* garde sa protection actuelle (ne pas modifier auth-route).
      # strip_path:false conserve le préfixe complet (le service sert sur /auth/...).
      - name: auth-route-public
        paths:
          - /auth/forgot-password
          - /auth/reset-password
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Accept-Version
                - Content-Length
                - Content-MD5
                - Content-Type
                - Date
                - Authorization
              exposed_headers:
                - Authorization
              max_age: 3600
              credentials: true

