_format_version: "3.0"
_transform: true

services:
  - name: employee-service
    url: http://employee-service:8082
    routes:
      - name: employee-route
        paths:
          - /employees
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - Authorization
          max_age: 3600
          credentials: true
      - name: jwt

  - name: department-service
    url: http://department-service:8083
    routes:
      - name: department-route
        paths:
          - /departments
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
