          exposed_headers:
            - Authorization
          max_age: 3600
          credentials: true
      - name: jwt

  # Routes publiques du meeting-service (SANS JWT) — service séparé pointant vers le même upstream
  # Nécessaire car Kong DB-less applique les plugins service à TOUTES ses routes
  - name: meeting-service-public
    url: http://meeting-service:8088
    routes:
      # Google redirige ici après consentement OAuth — pas de JWT possible
      - name: meeting-google-callback-route
        paths:
          - /meetings/google/callback
        strip_path: false
      # Le navigateur navigue vers cette URL (window.location.href) — pas de JWT header possible
      # Le JWT est passé en query param ?access_token=... et vérifié par authenticateFromHeaderOrQuery
      - name: meeting-google-connect-route
        paths:
          - /meetings/google/connect
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - Authorization
          max_age: 3600
          credentials: true

